<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" />
    <title>Studiom</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #252525; --muted: #6b6b6b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #252525; --fg: #fbfbfb; --muted: #b4b4b4; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
      p { margin: 0; color: var(--muted); }
    </style>
  </head>

    <main>
