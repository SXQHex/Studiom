name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full matrix (all four profiles + visual), ADR-009.
    - cron: "0 1 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, Lint, Format, Knip, Boundaries
        run: pnpm check
      - name: Build With Bundle Budget
        run: pnpm build

  e2e:
    name: E2E Tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Official Playwright image: same browsers and fonts everywhere, so visual baselines are stable.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      CI: "true"
      FULL_MATRIX: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Behavior Suite
        run: |
          set -euo pipefail
          if [ "$FULL_MATRIX" = "true" ]; then
            pnpm e2e
          else
            pnpm e2e --project=desktop-chromium --project=iphone-15 --project=smoke
          fi
      - name: Accessibility Suite
        run: pnpm e2e:a11y
      - name: Visual Suite
        if: env.FULL_MATRIX == 'true'
        run: pnpm e2e:visual
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
