name: Update Visual Baselines

# Add the "update-visual-baselines" label to a pull request (or run this manually on a
# branch) to regenerate the screenshots. The result is committed to that branch, where the
# images are approved by reviewing them in "Files changed" (ADR-014).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    # Never on forks, never directly on the default branch.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref_name != github.event.repository.default_branch) ||
      (github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      playwright: ${{ steps.versions.outputs.playwright }}
    steps:
      - name: Remove Label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/$REPO/issues/$PR/labels/update-visual-baselines"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read Playwright Version
        id: versions
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")"
          echo "playwright=$version" >> "$GITHUB_OUTPUT"

  generate:
    name: Generate Screenshots
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs branch code, so it gets no write access.
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prepare.outputs.playwright }}-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Screenshots
        run: pnpm e2e:visual --update-snapshots=changed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit Baselines
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs no branch code. Writes the images and asks CI to verify the new commit.
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      # Credentials are kept because this job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__/
      - name: Commit and Push
        id: push
        run: |
          set -euo pipefail
          find apps/web/e2e/__screenshots__ -type f ! -name '*.png' -delete
          git add apps/web/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): update baselines"
          # Fails if the branch moved meanwhile, so stale screenshots are never pushed.
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A push made with the workflow token starts no CI run by itself.
      - name: Start CI on the New Commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run ci.yaml --repo "$REPO" --ref "$BRANCH" ||
            echo "::warning::CI could not be started (it must exist on the default branch). Close and reopen the pull request to run it."
