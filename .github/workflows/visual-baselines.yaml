name: Update Visual Baselines

# Add the "update-visual-baselines" label to a pull request (or run this manually on a
# branch) to regenerate the screenshots. The result is committed to that branch, where the
# images are approved by reviewing them in "Files changed" (ADR-014).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    # Never on forks, never directly on the default branch.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref_name != github.event.repository.default_branch) ||
      (github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      playwright: ${{ steps.versions.outputs.playwright }}
    steps:
      - name: Remove Label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/$REPO/issues/$PR/labels/update-visual-baselines"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read Playwright Version
        id: versions
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")"
          echo "playwright=$version" >> "$GITHUB_OUTPUT"

  generate:
    name: Generate Screenshots
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs branch code, so it gets no write access.
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prepare.outputs.playwright }}-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Screenshots
        run: pnpm e2e:visual --update-snapshots=changed
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit Baselines
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs no branch code. Only writes the images.
    # CI for the new commit waits for "Approve and run workflows" on the pull request,
    # because it is pushed with the workflow token.
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__/
      # The credentials are set only for the push, not stored by checkout.
      # The checkout stays on the generated commit, so the push fails if the branch moved
      # meanwhile and stale screenshots are never pushed.
      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          branch: ${{ env.BRANCH }}
          skip_fetch: true
          skip_checkout: true
          # Only images are committed, whatever else the artifact holds.
          file_pattern: apps/web/e2e/__screenshots__/*.png
          disable_globbing: true
          commit_message: "test(visual): update baselines"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          before_push_hook: gh auth setup-git
