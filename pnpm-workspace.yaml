packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msw: false
  "@swc/core": false

# Exact versions (ADR-012).
saveExact: true
savePrefix: ""

# dependency-cruiser cannot read TypeScript 7.0 sources (supported from 7.1, ADR-012).
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
